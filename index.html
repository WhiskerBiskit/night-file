<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Night File</title>
<meta name="description" content="Dark true stories from Wikipedia, for reading before bed.">
<meta name="theme-color" content="#0f1c15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Newsreader:opsz,ital,wght@6..72,0,400;6..72,0,500;6..72,1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow reading column, like a leather case file opened in a dark forest cabin. Dark-only for night reading.
   Palette: forest green ground, walnut brown panels, old-gold accent. */
:root{
  --ink:#0f1c15; --deep:#09110c; --glow:#1d3426; --folder:#2a2018; --folder-hi:#33271d; --rule:#4a3b2a;
  --paper:#ede4cf; --dim:#a89f87; --lamp:#d4a640; --moss:#7d9a6a; --warn:#d0805e;
  --ease:cubic-bezier(.22,.7,.2,1);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --size:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--deep)}
html,body{margin:0;color:var(--paper)}
body{min-height:100vh}
body{font-family:var(--f-body);font-size:var(--size);line-height:1.65;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px));
  background:radial-gradient(120% 60% at 50% -10%, var(--glow) 0%, var(--ink) 55%, var(--deep) 100%) fixed, var(--ink);}
img{max-width:100%;height:auto}
html{scroll-behavior:smooth}
button,.btn,.chip,.more,a{transition:background-color .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease),transform .18s var(--ease),opacity .3s var(--ease)}
button:active:not([disabled]),.btn:active,.chip:active{transform:scale(.96)}
#file{transition:opacity .18s var(--ease),transform .18s var(--ease)}
#file.swap-out{opacity:0;transform:translateY(6px) scale(.995)}
#file.swap-in{animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-8px) scale(.99)}to{opacity:1;transform:none}}
@keyframes lift{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
[hidden]{display:none!important}
.wrap{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mast b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;text-transform:none;color:var(--paper);font-weight:700;cursor:pointer}
.mast b span{color:var(--lamp)}
.mast .tools{display:flex;gap:6px;position:relative}
.iconbtn{width:42px;height:42px;padding:0;justify-content:center;font-size:18px;letter-spacing:0;border-radius:50%}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;min-width:240px;display:flex;flex-direction:column;gap:2px;padding:8px;
  background:linear-gradient(180deg,var(--folder-hi),var(--folder));border:1px solid var(--rule);border-radius:8px;box-shadow:0 20px 40px -16px #000;animation:drop .25s var(--ease) both;transform-origin:top right;text-transform:none;letter-spacing:0}
.menu .item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:5px;font-family:var(--f-mono);font-size:13px;color:var(--paper)}
.menu .item:hover,.menu .item:focus-visible{background:color-mix(in srgb,var(--lamp) 14%,transparent);outline:none}
.menu .item span{color:var(--dim);font-size:12px}
.menu .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;font-family:var(--f-mono);font-size:13px;color:var(--paper)}
.menu .row div{display:flex;gap:6px;align-items:center}
.menu .row output{min-width:30px;text-align:center;color:var(--dim);font-size:12px}
.menu hr{border:0;border-top:1px dashed var(--rule);margin:4px 6px}


.filters{display:flex;flex-direction:column;gap:10px;position:relative}
.bar{display:flex;gap:8px}
.sel{flex:1 1 0;min-width:0;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:8px;row-gap:1px;text-align:left;text-transform:none;letter-spacing:.02em;font-size:14px;padding:8px 12px;background:var(--folder)}
.sel .k{grid-column:1;grid-row:1;color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.sel b{grid-column:1;grid-row:2;font-weight:500;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sel .caret{grid-column:2;grid-row:1 / span 2;align-self:center;color:var(--lamp);transition:transform .3s var(--ease)}
.sel[aria-expanded="true"]{border-color:var(--lamp)}
.sel[aria-expanded="true"] .caret{transform:rotate(180deg)}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:none;padding:7px 11px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--dim);cursor:pointer}
.chip:hover{border-color:var(--moss);color:var(--paper)}
.chip[aria-pressed="true"]{border-color:var(--lamp);color:var(--paper);background:color-mix(in srgb, var(--lamp) 18%, transparent)}
.panel{display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,var(--folder-hi),var(--folder));border:1px solid var(--rule);border-radius:8px;padding:14px;animation:drop .28s var(--ease) both;transform-origin:top;box-shadow:0 18px 40px -24px #000}
.panel.closing{animation:drop .18s var(--ease) reverse both}
.panel h4{margin:6px 0 0;font-family:var(--f-display);font-weight:500;font-size:17px;color:var(--lamp)}
.panel h4:first-child{margin-top:0}
.panel .hint{margin:0;font-size:14px;color:var(--dim)}
.panel .done{align-self:flex-end;margin-top:4px}

.file{background:linear-gradient(180deg,var(--folder-hi),var(--folder));border:1px solid var(--rule);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 40px -24px #000}
.heroBox{height:clamp(170px,50vw,300px);overflow:hidden;background:linear-gradient(90deg,var(--deep),var(--folder),var(--deep));background-size:200% 100%;animation:shimmer 1.8s linear infinite}
.heroBox.done{animation:none;background:var(--deep)}
.file .hero{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) sepia(.12);opacity:0;transform:scale(1.03);transition:opacity .7s var(--ease),transform 1.2s var(--ease)}
.file .hero.loaded{opacity:1;transform:none}
.file .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.tag{border:1px solid var(--lamp);color:var(--lamp);border-radius:2px;padding:1px 7px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,7vw,40px);line-height:1.12;margin:0;text-wrap:balance}
.desc{margin:0;color:var(--dim);font-style:italic}
.lede{margin:0}
/* loading placeholders: a shimmering outline of the card, so nothing jumps */
.sk{background:linear-gradient(90deg,var(--folder) 0%,var(--folder-hi) 50%,var(--folder) 100%);background-size:200% 100%;animation:shimmer 1.6s linear infinite;border-radius:4px}
.skel{display:flex;flex-direction:column}
.skel .sk-hero{height:clamp(170px,50vw,300px);border-radius:0}
.skel .sk-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.sk-line{height:14px}
.sk-line.big{height:30px}
.w30{width:30%}.w60{width:60%}.w80{width:80%}.w95{width:95%}
.sk-text{margin:4px 0 0;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--dim)}
.artwait{display:flex;flex-direction:column;gap:10px}
.msg{font-size:16px;border-left:2px solid var(--warn);padding-left:12px;margin:0 20px 18px}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.cardact{display:flex;gap:8px;align-items:stretch}
.cardact #read{flex:1;justify-content:center}
.cardact .iconbtn{border-radius:4px;width:46px;height:auto;min-height:44px}
.iconbtn[aria-pressed="true"]{color:var(--lamp);border-color:var(--lamp)}
button,.btn{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;border-radius:3px;padding:11px 16px;border:1px solid var(--rule);background:transparent;color:var(--paper);display:inline-flex;align-items:center;gap:8px}
button.primary{background:linear-gradient(180deg,#e0b450,var(--lamp));border-color:var(--lamp);color:#22180b;font-weight:500}
button.primary:hover:not([disabled]){filter:brightness(1.07)}
button.small{padding:6px 10px;font-size:11px}
button:hover,.btn:hover{border-color:var(--lamp)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
button[disabled]{opacity:.35;cursor:default}

.toc{border:1px solid var(--rule);border-radius:6px;background:color-mix(in srgb,var(--folder) 70%,transparent);padding:0 14px}
.toc summary,.fold > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper)}
.toc summary::-webkit-details-marker,.fold > summary::-webkit-details-marker{display:none}
.toc summary::after,.fold > summary::after{content:"▾";color:var(--lamp);font-size:14px;transition:transform .3s var(--ease)}
.toc[open] summary::after,.fold[open] > summary::after{transform:rotate(180deg)}
.toc summary span,.fold > summary span{color:var(--dim);letter-spacing:.06em;margin-left:auto}
.toc ol{margin:0 0 12px;padding:10px 0 0 1.4em;display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--rule);animation:drop .25s var(--ease) both}
.toc li::marker{font-family:var(--f-mono);font-size:13px;color:var(--dim)}
.toc ol button{all:unset;cursor:pointer;color:var(--paper);font-size:17px;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}

/* Wikipedia article */
#article{max-width:64ch;display:flex;flex-direction:column;gap:.9em;overflow-wrap:anywhere}
#article section{display:flex;flex-direction:column;gap:.9em}
#article p,#article ul,#article ol,#article blockquote,#article dl{margin:0}
#article ul,#article ol{padding-left:1.3em}
#article p.lead::first-letter{font-family:var(--f-display);float:left;font-size:3.4em;line-height:.85;padding:6px 8px 0 0;color:var(--lamp)}
#article h2{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.2;margin:.8em 0 0;padding-bottom:6px;border-bottom:1px solid var(--rule);scroll-margin-top:16px}
#article h3{font-family:var(--f-display);font-weight:500;font-size:20px;margin:.5em 0 0;color:var(--lamp)}
#article h4{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:.4em 0 0;color:var(--dim)}
#article a{color:var(--paper);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--lamp) 55%,transparent);text-underline-offset:3px}
#article blockquote{border-left:2px solid var(--rule);padding-left:14px;color:var(--dim);font-style:italic}
#article figure{margin:.4em 0;display:flex;flex-direction:column;gap:6px}
#article figure img{border-radius:3px;max-height:70vh;width:auto;align-self:flex-start;background:var(--deep)}
#article img{opacity:0;transition:opacity .6s var(--ease)}
#article img.loaded{opacity:1}
#article.enter > *{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i, 0) * 60ms)}
.toc:not([hidden]),.credit:not([hidden]),#after:not([hidden]){animation:rise .5s var(--ease) both}
.list li{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i, 0) * 40ms)}
#article figcaption{font-size:14px;line-height:1.45;color:var(--dim)}
#article .tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:3px}
#article table{border-collapse:collapse;font-size:14px;line-height:1.4;min-width:100%}
#article th,#article td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
#article .infobox-wrap{background:var(--folder);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
#article .infobox-wrap table{width:100%;font-size:14px}
#article .infobox-wrap th{color:var(--dim);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:400;width:38%}
#article .infobox-wrap img{display:block;margin:0 auto;max-height:340px;width:auto}
#article ul.gallery{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
#article .speaking{transition:background-color .4s var(--ease);background:color-mix(in srgb,var(--lamp) 14%,transparent);box-shadow:-8px 0 0 color-mix(in srgb,var(--lamp) 14%,transparent),8px 0 0 color-mix(in srgb,var(--lamp) 14%,transparent);border-radius:2px}
.credit{font-size:14px;color:var(--dim);border-top:1px solid var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.credit a{color:var(--lamp)}

.list{display:flex;flex-direction:column}
.list h3{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:400}
.list ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--rule)}
.list li .pick{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:10px 0}
.list li .pick:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.list .th{width:56px;height:56px;border-radius:3px;object-fit:cover;background:var(--folder);border:1px solid var(--rule)}
.list .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.list .t{font-family:var(--f-display);font-size:18px;line-height:1.25}
.list li .pick:hover .t{color:var(--lamp)}
.list .rm{all:unset;cursor:pointer;flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--dim);font-size:16px}
.list .rm:hover,.list .rm:focus-visible{color:var(--warn);outline:1px solid var(--rule)}
.groups{display:flex;flex-direction:column;gap:8px}
.groups details{border:1px solid var(--rule);border-radius:6px;padding:4px 12px;background:color-mix(in srgb,var(--folder) 60%,transparent)}
.groups summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-family:var(--f-display);font-size:18px;color:var(--lamp)}
.groups summary::-webkit-details-marker{display:none}
.groups summary span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--dim)}
.groups details[open] summary{border-bottom:1px dashed var(--rule)}
.groups ul li:last-child{border-bottom:0}
button[aria-pressed="true"]#save2{border-color:var(--lamp);color:var(--lamp)}
.list .s{font-size:14px;color:var(--dim);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fold{border:1px solid var(--rule);border-radius:6px;padding:0 14px;background:color-mix(in srgb,var(--folder) 55%,transparent)}
.fold > summary{font-size:12px}
.fold[open] > summary{border-bottom:1px dashed var(--rule)}
.fold > .groups,.fold > ul{padding:10px 0 12px;animation:drop .25s var(--ease) both}
.fold ul li:last-child{border-bottom:0}
.list .th.ph{object-fit:contain;padding:8px;opacity:.55}

/* Listen controls: live at the top of each story, settings fold away */
.listen{display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,var(--folder-hi),var(--folder));border:1px solid var(--rule);border-radius:6px;padding:12px 14px;animation:rise .45s var(--ease) both}
.lrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.lrow .left{font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
.lsettings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;border-top:1px dashed var(--rule);padding-top:10px;animation:drop .3s var(--ease) both}
.lsettings label{display:flex;flex-direction:column;gap:4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);min-width:0}
.lsettings select{font-family:var(--f-mono);font-size:13px;background:var(--ink);color:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:8px 6px;width:100%}
.mini{position:fixed;right:calc(16px + env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:20;width:52px;height:52px;padding:0;justify-content:center;border-radius:50%;
  background:linear-gradient(180deg,#e0b450,var(--lamp));border-color:var(--lamp);color:#22180b;font-size:18px;box-shadow:0 10px 24px -8px #000;animation:rise .35s var(--ease) both}
.back{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--lamp);display:inline-flex;gap:6px;align-items:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 0}
.back:hover{text-decoration:underline}
.back:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.file .hero,#article img{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <b id="home" title="Back to tonight's story">Night<span>/</span>File</b>
    <div class="tools">
      <button class="iconbtn" id="menuBtn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div class="menu" id="menu" role="menu" hidden>
        <div class="row">Text size<div><button class="small" id="smaller" type="button" aria-label="Smaller text">A−</button><output id="sizeOut"></output><button class="small" id="bigger" type="button" aria-label="Larger text">A+</button></div></div>
        <hr>
        <button class="item" id="toSaved" type="button" role="menuitem">★ Saved stories <span id="menuSaved"></span></button>
        <button class="item" id="toRecent" type="button" role="menuitem">Recent stories <span id="menuRecent"></span></button>
        <button class="item" id="toTop" type="button" role="menuitem">Back to top <span>↑</span></button>
      </div>
    </div>
  </header>

  <div class="filters" id="filters">
    <div class="bar">
      <button class="sel" id="catBtn" type="button" aria-expanded="false" aria-controls="catPanel"><span class="k">Category</span><b id="catLabel"></b><span class="caret">▾</span></button>
      <button class="sel" id="eraBtn" type="button" aria-expanded="false" aria-controls="eraPanel"><span class="k">Era</span><b id="eraLabel"></b><span class="caret">▾</span></button>
    </div>
    <div class="panel" id="catPanel" hidden></div>
    <div class="panel" id="eraPanel" hidden></div>
  </div>

  <section class="file" id="file" aria-live="polite">
    <div class="skel" id="wait" aria-busy="true">
      <div class="sk sk-hero"></div>
      <div class="sk-body"><div class="sk sk-line w30"></div><div class="sk sk-line big w80"></div><div class="sk sk-line w95"></div><div class="sk sk-line w60"></div><p class="sk-text" id="waitText">Opening the case file…</p></div>
    </div>
    <p class="msg" id="msg" hidden></p>
    <div id="card" hidden>
      <div class="heroBox" id="heroBox" hidden><img class="hero" id="hero" alt=""></div>
      <div class="body">
        <button class="back" id="back" type="button" hidden>← Back to <span id="backTitle"></span></button>
        <div class="meta"><span class="tag" id="cat"></span><span id="mins"></span></div>
        <h1 id="title"></h1>
        <p class="desc" id="desc"></p>
        <p class="lede" id="lede"></p>
        <div class="cardact" id="actions">
          <button class="primary" id="read" type="button">Read full story</button>
          <button class="iconbtn" id="another" type="button" aria-label="Different story" title="Different story">↻</button>
          <button class="iconbtn" id="save" type="button" aria-pressed="false" aria-label="Save story" title="Save story">☆</button>
        </div>
      </div>
    </div>
  </section>

  <div class="listen" id="listen" hidden>
    <div class="lrow">
      <button class="primary" id="play" type="button">▶ Listen</button>
      <button id="stopL" type="button" hidden>■ Stop</button>
      <button class="more" id="lset" type="button" aria-expanded="false" aria-controls="lsettings">Voice settings ▾</button>
      <span class="left" id="left"></span>
    </div>
    <div class="lsettings" id="lsettings" hidden>
      <label>Voice<select id="voice"></select></label>

<script>
"use strict";
const API = "https://en.wikipedia.org/w/api.php";
const REST = "https://en.wikipedia.org/api/rest_v1/page/html/";
const el = id => document.getElementById(id);
const KEY = "nightfile.wiki.v1";
let state = {seen:[], library:[], current:null, queue:{key:"", items:[]}, filters:{cat:"any", eras:["1990s","2010s"]}, size:18, progress:{}, voice:"", rate:"1"};
try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s) state = Object.assign(state, s); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const pickOne = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = [...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => String(s||"").trim().toLowerCase();

/* Each category: Wikipedia search queries (CirrusSearch). Category and template queries are sampled at random; keyword queries by relevance. */
// Wikipedia category list helper: C("A|B") -> incategory:A|B (any of them)
const C = list => "incategory:" + list.split("|").map(x => x.trim().replace(/ /g, "_")).join("|");
const SECTIONS = [
  ["True crime", {
    serial:   {label:"Serial killers", q:['hastemplate:"Infobox serial killer"', C("American serial killers|English serial killers|German serial killers|Russian serial killers|Canadian serial killers|Australian serial killers|South African serial killers|Colombian serial killers|Japanese serial killers|French serial killers")]},
    captive:  {label:"Held captive", q:[C("Kidnapped American children|Formerly missing American people|Formerly missing Austrian people|Formerly missing people|1990s kidnappings in the United States|2000s kidnappings in the United States|2010s kidnappings in the United States"), C("Kidnappings in the United States|Kidnappings in England|Kidnappings in Canada|Kidnappings in Australia")]},
    family:   {label:"Family murders", q:[C("Familicides in the United States|Familicides in England|Familicides in Australia|Familicides in Canada|Familicides|Child filicides in the United States|Perpetrators of filicide|Uxoricides in the United States|Parricides")]},
    medical:  {label:"Medical killers", q:[C("Medical serial killers|Medical doctors convicted of murdering their patients|Nurses convicted of killing patients|Medical scandals in the United Kingdom")]},
    pairs:    {label:"Killer couples", q:[C("Serial killer duos"), '"killer couple" hastemplate:"Infobox criminal"']},
    cold:     {label:"Cold cases cracked", q:[C("People convicted using DNA evidence"), 'hastemplate:"Infobox serial killer" "genetic genealogy"', '"genetic genealogy" "cold case" murder hastemplate:"Infobox criminal"']},
    web:      {label:"Online & dark web", q:['murder "met online" hastemplate:"Infobox criminal"', 'murder "dark web" hastemplate:"Infobox criminal"', C("Filmed killings in North America|Filmed killings in Europe")]},
    unsolved: {label:"Unsolved murders", q:[C("Unsolved murders in the United States|Unsolved murders in England|Unsolved murders in Canada|Unsolved murders in Australia|Unsolved murders in Colorado|Unsolved murders in California|Unidentified American criminals|Unidentified serial killers")]}
  }],
  ["The unexplained", {
    unexplained:{label:"Strange deaths & vanishings", q:[C("Unsolved deaths in the United States|Unsolved deaths in Russia|Unsolved deaths in Alaska|Death conspiracy theories|1990s missing person cases|2000s missing person cases|2010s missing person cases|Missing person cases in California")]},
    ufo:      {label:"UFOs & aliens", q:[C("UFO sightings in the United States|UFO sightings|Alleged extraterrestrial encounters|UFO crashes|Aviation incidents involving UFOs and military aircraft|Alien abduction reports|Alien abductions"), 'UFO incident sighting witnesses']},
    haunted:  {label:"Hauntings & exorcisms", q:[C("Poltergeists|Paranormal hoaxes|English ghosts"), C("Reportedly haunted locations in California|Reportedly haunted locations in New York (state)|Reportedly haunted locations in Texas|Reportedly haunted locations in Kentucky|Reportedly haunted locations in Philadelphia|Reportedly haunted locations in London|Reportedly haunted locations in Scotland|Reportedly haunted locations in Ohio|Reportedly haunted locations in Pennsylvania|Reportedly haunted locations in England")]},
    hysteria: {label:"Mass hysteria & panics", q:[C("Mass psychogenic illness|Mass psychogenic illness in Europe|Satanic ritual abuse hysteria|Witch trials|Witch trials in the United States|Day care sex abuse hysteria")]},
    signals:  {label:"Eerie signals & broadcasts", q:[C("Numbers stations|Pirate television|Broadcast signal intrusions|Unidentified radio signals")]}
  }],
  ["Air, sea & space", {
    air:      {label:"Air disasters", q:['hastemplate:"Infobox aircraft occurrence"','hastemplate:"Infobox aircraft occurrence" crash fatalities']},
    ships:    {label:"Shipwrecks", q:[C("Ferry boat disasters|Maritime incidents involving engineering failures|Passenger ships lost at sea|Shipwrecks in the Yellow Sea"), 'shipwreck sank passengers drowned', 'ferry disaster capsized']},
    subs:     {label:"Submarines & submersibles", q:[C("Submarines lost with all hands|Submarine accidents|Russian submarine accidents|United States submarine accidents|Submarine disasters")]},
    diving:   {label:"Deep sea & diving", q:[C("Underwater diving deaths|Commercial diving accidents|Decompression accidents and incidents|Diving accidents|Free-diving deaths")]},
    space:    {label:"Space disasters", q:[C("Space program fatalities|Space Shuttle disasters|Space accidents and incidents in the United States|Space accidents and incidents in the Soviet Union|Space accidents and incidents in Russia")]}
  }],
  ["Extreme nature", {
    mountains:{label:"Mountains & climbing", q:[C("Mountaineering disasters|Deaths on Mount Everest|Deaths on K2|Mountaineering deaths in Nepal|Mountaineering deaths in Pakistan"), C("Mountaineering disasters|Mountaineering deaths")]},
    caves:    {label:"Caves & mines", q:[C("Mining rescues|Coal mining disasters in West Virginia|Coal mining disasters in the United States|Coal mining disasters in England|Coal mining disasters in Wales|Caving incidents and rescues|Mining disasters in Chile|Mining disasters in China"), 'mine disaster miners killed']},
    lost:     {label:"Lost in the wild", q:[C("Formerly missing people|Missing person cases in Alaska|Missing person cases in Australia|Unsolved deaths in Alaska|Accidental deaths in Alaska"), C("Mountaineering disasters|Caving incidents and rescues|Mining rescues")]},
    animals:  {label:"Animal attacks", q:[C("Deaths due to animal attacks in the United States|Deaths due to shark attacks|Deaths due to bear attacks in the United States|Shark attacks in the United States|Man-eaters|Deaths due to animal attacks in India|Deaths due to crocodile attacks|Deaths due to tiger attacks")]},
    natural:  {label:"Natural disasters", q:['hastemplate:"Infobox earthquake"', C("Lahars|Avalanches in the United States|Tsunamis|Tsunamis in Japan|20th-century volcanic events|Deadliest earthquakes")]}
  }],
  ["Science & industry", {
    nuclear:  {label:"Nuclear & radiation", q:[C("Civilian nuclear power accidents|Radiation accidents and incidents|INES Level 7 accidents|Nuclear accidents and incidents|Military nuclear accidents|Criticality accidents and incidents")]},
    industrial:{label:"Industrial disasters", q:[C("Industrial fires and explosions in the United States|Chemical disasters|Man-made disasters in the Soviet Union|Building collapses in the United States|Dam failures|Bridge disasters in the United States"), 'industrial disaster explosion killed']},
    experiments:{label:"Medical experiments", q:[C("Human subject research in the United States|Japanese human subject research|Medical experimentation on prisoners of war|Medical scandals in the United States|Medical scandals in the United Kingdom|Nazi human subject research")]},
    outbreaks:{label:"Outbreaks & poisonings", q:[C("Mass poisonings|Health disasters in the United States|Health disasters in India|Chemical disasters|Food poisoning incidents|Water contamination")]}
  }],
  ["Dark history", {
    cults:    {label:"Cults", q:[C("Mass suicides|Peoples Temple"), 'cult leader followers deaths']},
    survival: {label:"Survival horror", q:[C("Incidents of cannibalism|Mining rescues|Caving incidents and rescues"), '"survival cannibalism"']},
    inspired: {label:"Behind horror films", q:['hastemplate:"Infobox serial killer" "horror film"', 'hastemplate:"Infobox criminal" "horror film"', 'hastemplate:"Infobox civilian attack" "horror film"']},
    places:   {label:"Dark places", q:[C("Defunct prisons in Pennsylvania|Prison museums in the United States|Tuberculosis sanatoria in the United States|Defunct psychiatric hospitals in the United States|Reportedly haunted locations in Kentucky|Ghost towns in South America|Abandoned buildings and structures"), 'massacre site memorial']}
  }]
];
const CATS = {any:{label:"Surprise me"}};
SECTIONS.forEach(([, c]) => Object.assign(CATS, c));
const SURPRISE = Object.keys(CATS).filter(k => k !== "any" && k !== "unsolved");
const ERAS = [
  {k:"pre1900", label:"Before 1900", min:0,    max:1899},
  {k:"1900s",   label:"1900–1949",   min:1900, max:1949},
  {k:"1950s",   label:"1950–1989",   min:1950, max:1989},
  {k:"1990s",   label:"1990–2009",   min:1990, max:2009},
  {k:"2010s",   label:"2010–now",    min:2010, max:9999}
];
// carry over the old single-era setting
if(!Array.isArray(state.filters.eras)) state.filters.eras = state.filters.era === "any" ? [] : ["1990s","2010s"];
delete state.filters.era;
state.filters.eras = state.filters.eras.filter(k => ERAS.some(e => e.k === k));
const BLOCK = /dahmer|\bgein\b|^list of|^lists of|\(disambiguation\)|^timeline of|^outline of|^index of|^history of|^category:/i;
const BLOCK_DATE = /^(\d{4}|deaths in|(january|february|march|april|may|june|july|august|september|october|november|december) \d{4})\b|^\d{4}( in |s in | deaths)/i;
// Skip entertainment, fiction and other pages that aren't real stories.
const NOT_A_STORY = /\b(television|tv series|sitcom|film|novel|video game|album|song|band|franchise|comic|manga|anime|episode|season \d|musical|play by|book series|board game|website|podcast|wrestler|footballer|baseball|basketball|cricketer|rapper|singer|actor|actress|poet|politician|prime minister|king of|queen of|emperor|pharaoh|saint|disciple|ruler|tribe|atoll|lake in|city in|village in|neighborhood in|company|telescope|satellite|cometary|power plant|power station|closed city|icebreaker|stratovolcano|volcanic cone|volcano in|large volcano|active volcano|highest mountain|mountain in|physicist|herpetologist|athlete|businessman)\b/i;
const SKIP_SECTIONS = /^(references|notes|external links|further reading|see also|bibliography|sources|citations|footnotes|works cited|explanatory notes|notes and references|in popular culture|filmography|gallery)$/i;
if(!CATS[state.filters.cat]) state.filters.cat = "any";
let busy = false;

/* ---------- Wikipedia API ---------- */
async function api(params){
  const u = new URL(API);
  Object.entries(Object.assign({format:"json", formatversion:"2", origin:"*"}, params)).forEach(([k,v]) => { if(v !== undefined) u.searchParams.set(k, v); });
  const r = await fetch(u);
  if(!r.ok) throw new Error("Wikipedia returned " + r.status);
  const j = await r.json();
  if(j.error) throw Object.assign(new Error(j.error.info || "Wikipedia error"), {code:j.error.code});
  return j;
}

async function searchPool(q){
  const structured = /incategory:|hastemplate:/.test(q);
  const base = {action:"query", list:"search", srsearch:q, srnamespace:0, srlimit:50, srprop:"size|wordcount"};
  try{
    if(structured){ const j = await api(Object.assign({srsort:"random"}, base)); return j.query.search || []; }
    const j = await api(Object.assign({sroffset: Math.floor(Math.random()*120)}, base));
    if((j.query.search||[]).length) return j.query.search;
    return (await api(base)).query.search || [];
  }catch(e){
    if(structured){ const j = await api(Object.assign({sroffset: Math.floor(Math.random()*100)}, base)); return j.query.search || []; }
    throw e;
  }
}

async function details(titles){
  if(!titles.length) return [];
  const j = await api({action:"query", prop:"extracts|pageimages|description", exintro:1, explaintext:1, exlimit:20,
    piprop:"thumbnail", pithumbsize:900, pilimit:20, pilicense:"any", redirects:1, titles:titles.slice(0,20).join("|")});
  return (j.query.pages || []).filter(p => !p.missing && p.extract).map(p => ({
    title:p.title, extract:p.extract, desc:p.description || "", thumb:p.thumbnail ? p.thumbnail.source : ""
  }));
}

// The earliest year in the summary, ignoring a person's birth and death dates, marks when the story happened.
function storyYear(text){
  let t = text.slice(0, 1600);
  t = t.replace(/\([^)]{0,140}\)/, m => /born|died|\b(1[5-9]\d\d|20\d\d)\s*[–-]|\bc\.\s*\d{4}|\bb\.\s/i.test(m) ? "" : m);
  const years = [...t.matchAll(/\b(1[0-9]\d\d|20[0-2]\d)\b/g)].map(m => +m[1]);
  return years.length ? Math.min(...years) : null;
}
function eraOK(text){
  const sel = state.filters.eras;
  if(!sel.length) return true;
  const y = storyYear(text);
  if(y === null) return false;
  return ERAS.some(e => sel.includes(e.k) && y >= e.min && y <= e.max);
}

/* ---------- picking stories ---------- */
const qKey = () => state.filters.cat + "|" + state.filters.eras.join(",");
const isSeen = t => state.seen.map(norm).includes(norm(t));

async function batch(){
  const tries = state.filters.eras.length && state.filters.eras.length < 3 ? 7 : 4;
  for(let attempt = 0; attempt < tries; attempt++){
    const catKey = state.filters.cat === "any" ? pickOne(SURPRISE) : state.filters.cat;
    const cat = CATS[catKey];
    for(const q of shuffle(cat.q)){
      const pool = (await searchPool(q)).filter(r => !BLOCK.test(r.title) && !BLOCK_DATE.test(r.title) && !isSeen(r.title) && r.size >= 9000);
      if(!pool.length) continue;
      const words = Object.fromEntries(pool.map(r => [r.title, r.wordcount]));
      const top = shuffle(pool.sort((a,b) => b.size - a.size).slice(0, 30)).slice(0, 20).map(r => r.title);
      let items = (await details(top)).filter(d => !BLOCK.test(d.title) && !isSeen(d.title) && !NOT_A_STORY.test(d.desc));
      items = items.filter(d => eraOK(d.extract));
      if(items.length) return shuffle(items).map(d => Object.assign(d, {cat:cat.label, words:words[d.title] || 0}));
    }
  }
  return [];
}

function take(){
  if(state.queue.key !== qKey()) return null;
  while(state.queue.items.length){ const c = state.queue.items.shift(); if(!isSeen(c.title)) return c; }
  return null;
}

/* ---------- UI helpers ---------- */
function setWait(t){ el("waitText").textContent = t || ""; el("wait").hidden = !t; }
function setMsg(t){ el("msg").textContent = t || ""; el("msg").hidden = !t; }
function setBusy(on){ busy = on; ["read","another","next"].forEach(id => el(id).disabled = on); }
const firstSentences = (t, n) => (t.replace(/\s+/g," ").match(/[^.!?]+[.!?]+(\s|$)/g) || [t]).slice(0, n).join("").trim();
const mins = w => w ? Math.max(1, Math.round(w/230)) + " min read" : "";

function showCard(c){
  el("card").hidden = false;
  el("cat").textContent = c.cat || "Wikipedia";
  el("mins").textContent = mins(c.words);
  el("title").textContent = c.title;
  el("desc").textContent = c.desc ? c.desc.charAt(0).toUpperCase() + c.desc.slice(1) : "";
  el("desc").hidden = !c.desc;
  el("lede").textContent = firstSentences(c.extract || "", 3);
  const hero = el("hero"), box = el("heroBox");
  hero.classList.remove("loaded"); box.classList.remove("done");
  if(c.thumb){
    const shown = () => { hero.classList.add("loaded"); box.classList.add("done"); };
    hero.onload = shown; hero.onerror = () => { box.hidden = true; };
    hero.src = c.thumb; hero.alt = c.title; box.hidden = false;
    if(hero.complete && hero.naturalWidth) shown();
  } else { hero.removeAttribute("src"); box.hidden = true; }
  el("read").hidden = openingTitle === c.title;
  updateSaveButtons();
  const prev = backStack[backStack.length - 1];
  el("back").hidden = !prev;
  if(prev) el("backTitle").textContent = prev.item.title;
}

let openingTitle = "";
function clearArticle(){ openingTitle = ""; el("artWait").hidden = true; stopListen(); el("article").innerHTML = ""; el("toc").hidden = true; el("credit").hidden = true; el("after").hidden = true; el("listen").hidden = true; el("lsettings").hidden = true; el("lset").setAttribute("aria-expanded","false"); el("lset").textContent = "Voice settings ▾"; }

// Stories you came from by tapping links, newest last.
let backStack = [];
function present(c, keepBack){
  if(!keepBack) backStack = [];
  state.current = c;
  if(!isSeen(c.title)) state.seen.push(c.title);
  state.seen = state.seen.slice(-400);
  remember(c);
  save();
  setWait(""); setMsg(""); clearArticle();
  transition(() => { showCard(c); renderLib(); });
}
// Fade the case file out and back in when the story changes (plain CSS, so it can never get stuck).
function transition(fn){
  const f = el("file");
  if(reduce()){ fn(); return; }
  f.classList.add("swap-out");
  setTimeout(() => {
    fn();
    f.classList.remove("swap-out");
    f.classList.remove("swap-in"); void f.offsetWidth; f.classList.add("swap-in");
  }, 180);
}

// Quietly line up the next stories (and their photos) so "Different story" is instant.
let prefetchJob = null;
function prefetch(){
  if(prefetchJob) return prefetchJob;
  const key = qKey();
  if(state.queue.key === key && state.queue.items.filter(c => !isSeen(c.title)).length >= 2){ warm(); return null; }
  prefetchJob = batch().then(items => {
    if(qKey() !== key || !items.length) return;
    const have = state.queue.key === key ? state.queue.items : [];
    const titles = new Set(have.map(x => x.title));
    state.queue = {key, items: [...have, ...items.filter(x => !titles.has(x.title) && !isSeen(x.title))]};
    save(); warm();
  }).catch(() => {}).finally(() => { prefetchJob = null; });
  return prefetchJob;
}
function warm(){ state.queue.items.slice(0, 2).forEach(c => { if(c.thumb){ const i = new Image(); i.src = c.thumb; } }); }

// Older saved/recent entries may be missing a photo; look them up once.
async function backfillThumbs(){
  const all = [...state.library, ...state.saved];
  const need = [...new Set(all.filter(x => !x.thumb && !x.thumbTried).map(x => x.title))].slice(0, 20);
  if(!need.length) return;
  try{
    const d = await details(need);
    const found = Object.fromEntries(d.map(x => [x.title, x.thumb]));
    all.forEach(x => { if(need.includes(x.title)){ x.thumbTried = true; if(found[x.title]) x.thumb = found[x.title]; } });
    if(state.current && found[state.current.title] && !state.current.thumb) state.current.thumb = found[state.current.title];
    save(); renderLib();
  }catch(e){}
}

let findAgain = false;
async function findStory(){
  if(busy){ findAgain = true; return; }   // filters changed while loading: run again when this one finishes
  findAgain = false;
  const startKey = qKey();
  let q = take();
  if(!q && prefetchJob){ setBusy(true); el("card").hidden = true; clearArticle(); setWait("Digging through the archives…"); await prefetchJob; setBusy(false); q = take(); }
  if(q){ present(q); setTimeout(prefetch, 1200); return; }
  setBusy(true); setMsg(""); clearArticle(); el("card").hidden = true;
  setWait("Digging through the archives…");
  try{
    const items = await batch();
    setBusy(false); setWait("");
    if(findAgain || qKey() !== startKey){ findStory(); return; }
    if(!items.length){ setMsg("Couldn't find a new story in this category right now. Tap Different story or pick another category."); if(state.current) showCard(state.current); return; }
    state.queue = {key:qKey(), items:items.slice(1)};
    present(items[0]);
    setTimeout(prefetch, 1200);
  }catch(e){
    setBusy(false); setWait("");
    setMsg(navigator.onLine === false ? "You're offline. Connect to the internet to pull a story." : "Couldn't reach Wikipedia. Check your connection and tap Different story.");
    if(state.current) showCard(state.current);
  }
}


let listCount = 0;
function listItem(c, sub, onPick, onRemove){
  const li = document.createElement("li"), b = document.createElement("button"); b.type = "button"; b.className = "pick";
  const img = document.createElement("img"); img.className = "th"; img.alt = ""; img.loading = "lazy";
  if(c.thumb){ img.src = c.thumb; img.onerror = () => { img.onerror = null; img.src = "icon-192.png"; img.classList.add("ph"); }; } else { img.src = "icon-192.png"; img.classList.add("ph"); }
  const tx = document.createElement("span"); tx.className = "tx";
  const t = document.createElement("span"); t.className = "t"; t.textContent = c.title;
  const s = document.createElement("span"); s.className = "s"; s.textContent = sub || c.desc || c.cat || "";
  tx.append(t, s); b.append(img, tx); b.addEventListener("click", onPick);
  li.style.setProperty("--i", Math.min(listCount++, 12));
  li.append(b);
  if(onRemove){
    const x = document.createElement("button"); x.type = "button"; x.className = "rm"; x.textContent = "✕";
    x.setAttribute("aria-label", "Remove " + c.title + " from saved");
    x.addEventListener("click", onRemove); li.append(x);
  }
  return li;
}

const RECENT_MAX = 10;
function remember(c){
  const keep = Object.assign({}, c, {text: undefined});
  state.library = [keep, ...state.library.filter(x => x.title !== c.title)].slice(0, RECENT_MAX + 1);
}
function openFromList(c){
  if(busy) return;
  present(c); openArticle(c.title, true);
}
function renderLib(){
  const list = el("libList"); list.innerHTML = ""; listCount = 0;
  const items = state.library.filter(x => !state.current || x.title !== state.current.title).slice(0, RECENT_MAX);
  items.forEach(c => list.append(listItem(c, c.cat + (state.progress[c.title] ? " · " + Math.round(state.progress[c.title]*100) + "% read" : ""), () => openFromList(c))));
  el("lib").hidden = items.length === 0;
  el("libCount").textContent = items.length;
  el("menuRecent").textContent = items.length || "";
  el("toRecent").hidden = items.length === 0;
  renderSaved();
}

/* ---------- saved stories, grouped by type ---------- */
if(!Array.isArray(state.saved)) state.saved = [];
const isSaved = t => state.saved.some(x => x.title === t);
function groupOf(c){ return CATS[Object.keys(CATS).find(k => CATS[k].label === c.cat)] ? c.cat : "Other stories"; }
function toggleSave(){
  const c = state.current; if(!c) return;
  if(isSaved(c.title)) state.saved = state.saved.filter(x => x.title !== c.title);
  else state.saved.unshift(Object.assign({}, c, {savedAt: Date.now()}));
  save(); updateSaveButtons(); renderSaved();
}
function updateSaveButtons(){
  const on = !!(state.current && isSaved(state.current.title));
  el("save").textContent = on ? "★" : "☆";
  el("save").setAttribute("aria-pressed", String(on));
  el("save").setAttribute("aria-label", on ? "Saved. Tap to remove" : "Save story");
  el("save2").textContent = on ? "★ Saved" : "☆ Save";
  el("save2").setAttribute("aria-pressed", String(on));
}
const openGroups = new Set();
function renderSaved(){
  const wrap = el("savedGroups"); wrap.innerHTML = ""; listCount = 0;
  const order = Object.values(CATS).map(c => c.label);
  const groups = {};
  state.saved.forEach(c => (groups[groupOf(c)] = groups[groupOf(c)] || []).push(c));
  Object.keys(groups).sort((a, b) => (order.indexOf(a) + 1 || 999) - (order.indexOf(b) + 1 || 999)).forEach(name => {
    const d = document.createElement("details");
    if(openGroups.has(name)) d.open = true;
    d.addEventListener("toggle", () => d.open ? openGroups.add(name) : openGroups.delete(name));
    const sm = document.createElement("summary"); sm.textContent = name;
    const n = document.createElement("span"); n.textContent = groups[name].length + (groups[name].length === 1 ? " story" : " stories"); sm.append(n);
    const ul = document.createElement("ul");
    groups[name].forEach(c => ul.append(listItem(c, c.desc || "", () => openFromList(c), () => {
      state.saved = state.saved.filter(x => x.title !== c.title); save(); updateSaveButtons(); renderSaved();
    })));
    d.append(sm, ul); wrap.append(d);
  });
  el("savedSec").hidden = state.saved.length === 0;
  el("savedCount").textContent = state.saved.length;
  el("menuSaved").textContent = state.saved.length || "";
  el("toSaved").hidden = state.saved.length === 0;
}

/* ---------- filters: two drop-downs ---------- */
let panel = null, erasBefore = "";
function eraSummary(){
  const sel = state.filters.eras;
  if(!sel.length) return "Any era";
  const idx = sel.map(k => ERAS.findIndex(e => e.k === k)).sort((a, b) => a - b);
  const contiguous = idx.every((v, i) => i === 0 || v === idx[i - 1] + 1);
  if(!contiguous) return sel.length + " eras";
  const a = ERAS[idx[0]], b = ERAS[idx[idx.length - 1]];
  if(a === b) return a.label;
  if(a.min === 0) return "Up to " + (b.max === 9999 ? "now" : b.max);
  return a.min + "–" + (b.max === 9999 ? "now" : b.max);
}
function refilter(){ state.queue = {key:"", items:[]}; save(); renderFilters(); findStory(); }
function openPanel(which){
  if(panel === which){ closePanel(); return; }
  if(panel) closePanel(true);
  closeMenu();
  panel = which;
  if(which === "era") erasBefore = state.filters.eras.join(",");
  renderFilters();
}
function closePanel(instant){
  if(!panel) return;
  const was = panel, p = el(was === "cat" ? "catPanel" : "eraPanel");
  const finish = () => {
    p.classList.remove("closing"); p.hidden = true;
    if(panel === was) panel = null;
    renderFilters();
    if(was === "era" && state.filters.eras.join(",") !== erasBefore) refilter();
  };
  if(instant || reduce()){ finish(); return; }
  p.classList.add("closing"); setTimeout(finish, 170);
}
function chip(label, pressed, onClick){
  const b = document.createElement("button"); b.type = "button"; b.className = "chip";
  b.textContent = label; b.setAttribute("aria-pressed", String(pressed));
  b.addEventListener("click", onClick); return b;
}
function renderFilters(){
  el("catLabel").textContent = CATS[state.filters.cat].label;
  el("eraLabel").textContent = eraSummary();
  el("catBtn").setAttribute("aria-expanded", String(panel === "cat"));
  el("eraBtn").setAttribute("aria-expanded", String(panel === "era"));
  const cp = el("catPanel"), ep = el("eraPanel");
  cp.hidden = panel !== "cat"; ep.hidden = panel !== "era";
  if(panel === "cat"){
    cp.innerHTML = "";
    const top = document.createElement("div"); top.className = "frow";
    top.append(chip("Surprise me", state.filters.cat === "any", () => pickCat("any")));
    cp.append(top);
    SECTIONS.forEach(([name, group]) => {
      const h = document.createElement("h4"); h.textContent = name;
      const row = document.createElement("div"); row.className = "frow";
      Object.keys(group).forEach(k => row.append(chip(group[k].label, state.filters.cat === k, () => pickCat(k))));
      cp.append(h, row);
    });
  }
  if(panel === "era"){
    ep.innerHTML = "";
    const hint = document.createElement("p"); hint.className = "hint"; hint.textContent = "Pick one or more.";
    const row = document.createElement("div"); row.className = "frow";
    const sel = state.filters.eras;
    row.append(chip("Any era", !sel.length, () => { state.filters.eras = []; save(); renderFilters(); }));
    ERAS.forEach(e => row.append(chip(e.label, sel.includes(e.k), () => {
      const set = new Set(state.filters.eras); set.has(e.k) ? set.delete(e.k) : set.add(e.k);
      state.filters.eras = ERAS.map(x => x.k).filter(x => set.has(x));
      if(state.filters.eras.length === ERAS.length) state.filters.eras = [];
      save(); renderFilters();
    })));
    const done = document.createElement("button"); done.type = "button"; done.className = "primary small done"; done.textContent = "Done";
    done.addEventListener("click", () => closePanel());
    ep.append(hint, row, done);
  }
}
function pickCat(k){
  const changed = state.filters.cat !== k;
  state.filters.cat = k; save();
  closePanel();
  if(changed) refilter();
}
el("catBtn").addEventListener("click", () => openPanel("cat"));
el("eraBtn").addEventListener("click", () => openPanel("era"));

/* ---------- full article ---------- */
const DROP = "script,style,link,meta,iframe,object,embed,noscript,audio,video,sup.reference,sup.mw-ref,.mw-ref,.reference,.mw-editsection,.navbox,.navbox-styles,.vertical-navbox,.sidebar,.metadata,.ambox,.ombox,.tmbox,.cmbox,.hatnote,.dablink,.shortdescription,.sistersitebox,.side-box,.mw-empty-elt,.noprint,.reflist,.refbegin,.mw-references-wrap,ol.references,.portalbox,.authority-control,.mbox-small,.coordinates,.geo-nondefault,.mw-kartographer-maplink,.box-More_citations_needed,.module-shortcutboxplain,link[rel=mw-deduplicated-inline-style]";
const KEEP_CLASS = ["infobox","wikitable","gallery"];

function sanitize(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const body = doc.body;
  body.querySelectorAll(DROP).forEach(n => n.remove());
  // drop reference/appendix sections
  body.querySelectorAll("h2").forEach(h => {
    if(!SKIP_SECTIONS.test(h.textContent.trim())) return;
    const sec = h.closest("section");
    if(sec && sec.querySelector("h2") === h) { sec.remove(); return; }
    const start = h.closest(".mw-heading") || h;
    let n = start.nextSibling; start.remove();
    while(n && !(n.nodeType === 1 && (n.matches("h2") || n.matches(".mw-heading2") || n.querySelector?.(":scope > h2")))){ const nx = n.nextSibling; n.remove(); n = nx; }
  });
  body.querySelectorAll("img").forEach(img => {
    const w = +img.getAttribute("width") || 0;
    let s = img.getAttribute("src") || img.getAttribute("data-src") || "";
    if(s.startsWith("//")) s = "https:" + s;
    const orig = s;
    if(!/^https:\/\/(upload|thumb|maps)\.wikimedia\.org\//.test(s) || (w && w < 50) || /Question_book|Edit-clear|Ambox|Wiki_letter|Symbol_/i.test(s)){ img.remove(); return; }
    s = s.replace(/\/(\d+)px-/, (m, n) => +n < 500 ? "/960px-" : m); // Wikimedia only serves standard sizes (250, 330, 500, 960…)
    img.setAttribute("data-orig", orig); img.setAttribute("src", s); img.setAttribute("loading", "lazy");
  });
  body.querySelectorAll("a").forEach(a => {
    const href = a.getAttribute("href") || "";
    if(href.startsWith("./")){
      const raw = decodeURIComponent(href.slice(2)).split("#")[0];
      if(/^(File|Special|Help|Wikipedia|Template|Template_talk|Category|Portal|Talk|User|Module|Draft):/i.test(raw) || !raw){ a.replaceWith(...a.childNodes); return; }
      a.setAttribute("href", "https://en.wikipedia.org/wiki/" + raw);
      a.setAttribute("data-wiki", raw.replace(/_/g, " "));
    } else if(/^https?:/.test(href)){
      a.setAttribute("target", "_blank"); a.setAttribute("rel", "noopener");
    } else { a.replaceWith(...a.childNodes); }
  });
  body.querySelectorAll("*").forEach(n => {
    [...n.attributes].forEach(at => {
      const k = at.name;
      if(k === "class"){
        const keep = n.className.split(/\s+/).filter(c => KEEP_CLASS.includes(c));
        keep.length ? n.setAttribute("class", keep.join(" ")) : n.removeAttribute("class");
      } else if(!["href","src","alt","data-wiki","data-orig","colspan","rowspan","loading","target","rel"].includes(k)) n.removeAttribute(k);
    });
  });
  body.querySelectorAll("table").forEach(t => {
    const wrap = doc.createElement("div");
    wrap.className = t.classList.contains("infobox") ? "infobox-wrap" : "tablewrap";
    t.replaceWith(wrap); wrap.append(t);
  });
  body.querySelectorAll("p").forEach(p => { if(!p.textContent.trim() && !p.querySelector("img")) p.remove(); });
  body.querySelectorAll("span:empty, div:empty").forEach(n => n.remove());
  return body;
}

let openToken = 0;
async function openArticle(title, restore, y){
  const token = ++openToken;
  clearArticle();
  openingTitle = title;
  el("read").hidden = true;
  setMsg(""); el("artWait").hidden = false;
  try{
    const r = await fetch(REST + encodeURIComponent(title.replace(/ /g, "_")) + "?redirect=true");
    if(!r.ok) throw new Error("status " + r.status);
    const html = await r.text();
    if(token !== openToken) return;
    const body = sanitize(html);
    const art = el("article");
    art.classList.remove("enter");
    art.replaceChildren(...[...body.childNodes].map(n => document.importNode(n, true)));
    [...art.children].slice(0, 14).forEach((n, i) => n.style.setProperty("--i", i));
    void art.offsetWidth; art.classList.add("enter");
    art.querySelectorAll("img").forEach(img => { if(img.complete && img.naturalWidth) img.classList.add("loaded"); else img.addEventListener("load", () => img.classList.add("loaded"), {once:true}); img.addEventListener("error", () => { const o = img.dataset.orig; if(o && img.src !== o){ img.src = o; } else img.remove(); }); });
    const firstP = [...art.querySelectorAll("p")].find(p => !p.closest(".infobox-wrap,.tablewrap,figure") && p.textContent.trim().length > 60);
    if(firstP) firstP.classList.add("lead");
    buildToc();
    const words = (art.textContent.match(/\S+/g) || []).length;
    el("mins").textContent = mins(words);
    const page = "https://en.wikipedia.org/wiki/" + encodeURIComponent(title.replace(/ /g, "_"));
    const credit = el("credit"); credit.innerHTML = "";
    const p1 = document.createElement("span");
    p1.append("This article comes from ");
    const a1 = document.createElement("a"); a1.href = page; a1.target = "_blank"; a1.rel = "noopener"; a1.textContent = "Wikipedia: " + title;
    p1.append(a1, ". Text is available under ");
    const a2 = document.createElement("a"); a2.href = "https://creativecommons.org/licenses/by-sa/4.0/"; a2.target = "_blank"; a2.rel = "noopener"; a2.textContent = "CC BY-SA 4.0";
    p1.append(a2, ", written by Wikipedia's volunteer editors. References were removed for easier reading; the original has them all.");
    const a3 = document.createElement("a"); a3.href = "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(title); a3.target = "_blank"; a3.rel = "noopener"; a3.textContent = "More photos of " + title + " ↗";
    credit.append(p1, a3);
    credit.hidden = false; el("after").hidden = false;
    el("artWait").hidden = true;
    const c = state.current;
    if(c) c.words = words;
    if(c){
      const r = state.library.find(x => x.title === c.title); if(r) r.words = words;
      const sv = state.saved.find(x => x.title === c.title); if(sv) sv.words = words;
      save(); renderLib();
    }
    setupPlayer();
    if(typeof y === "number"){
      requestAnimationFrame(() => window.scrollTo({top: y}));
    } else if(restore && state.progress[title]){
      requestAnimationFrame(() => {
        const top = art.offsetTop, h = art.offsetHeight;
        window.scrollTo({top: top + h * state.progress[title] - 80});
      });
    } else {
      el("article").scrollIntoView({behavior: reduce() ? "auto" : "smooth", block: "start"});
    }
  }catch(e){
    if(token !== openToken) return;
    el("artWait").hidden = true; setMsg("Couldn't load the full article. Check your connection and try again.");
    el("read").hidden = false;
  }
}

function buildToc(){
  const toc = el("toc"), list = el("tocList"); list.innerHTML = "";
  const hs = [...el("article").querySelectorAll("h2")];
  if(hs.length < 2){ toc.hidden = true; return; }
  hs.forEach((h, i) => {
    h.id = "s-" + i;
    const li = document.createElement("li"), b = document.createElement("button");
    b.type = "button"; b.textContent = h.textContent;
    b.addEventListener("click", () => { toc.open = false; h.scrollIntoView({behavior: reduce() ? "auto" : "smooth", block:"start"}); });
    li.append(b); list.append(li);
  });
  el("tocCount").textContent = hs.length + " sections";
  toc.open = false; toc.hidden = false;
}

// links inside an article open that article here
el("article").addEventListener("click", ev => {
  const a = ev.target.closest("a[data-wiki]");
  if(!a) return;
  ev.preventDefault();
  if(busy) return;
  openLinked(a.getAttribute("data-wiki"));
});

async function openLinked(title){
  const from = state.current ? {item: state.current, y: scrollY, open: el("article").childNodes.length > 0} : null;
  let d = null;
  try{ d = (await details([title]))[0]; }catch(e){}
  const item = Object.assign({title, extract:"", desc:"", thumb:""}, d || {}, {cat:"Linked story"});
  if(from){ backStack.push(from); try{ history.pushState({nfBack: backStack.length}, ""); }catch(e){} }
  window.scrollTo({top:0});
  present(item, true);
  openArticle(item.title);
}

// Return to the story you were reading before tapping a link, at the same spot.
function goBack(){
  const prev = backStack.pop();
  if(!prev) return false;
  present(prev.item, true);
  if(prev.open) openArticle(prev.item.title, false, prev.y);
  else window.scrollTo({top:0});
  return true;
}
el("back").addEventListener("click", () => {
  if(!backStack.length) return;
  // use the browser history so the phone's back gesture stays in step
  if(history.state && history.state.nfBack) history.back(); else goBack();
});
addEventListener("popstate", () => { if(backStack.length) goBack(); });

// remember reading position
let progT = 0;
addEventListener("scroll", () => {
  clearTimeout(progT);
  progT = setTimeout(() => {
    const art = el("article"); const c = state.current;
    if(!c || !art.childNodes.length) return;
    const h = art.offsetHeight; if(h < 400) return;
    const p = Math.min(1, Math.max(0, (scrollY + 80 - art.offsetTop) / h));
    if(p > 0.02){ state.progress[c.title] = Math.round(p * 100) / 100; save(); }
  }, 400);
}, {passive:true});

/* ---------- listen mode ---------- */
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
let tts = {on:false, blocks:[], bi:0, cur:null, chunks:[], ci:0, timer:0, endAt:0, tick:0};
let voices = [];

function loadVoices(){
  if(!synth) return;
  voices = synth.getVoices().filter(v => /^en/i.test(v.lang));
  if(!voices.length) voices = synth.getVoices();
  const sel = el("voice"); sel.innerHTML = "";
  const def = document.createElement("option"); def.value = ""; def.textContent = "Default voice"; sel.append(def);
  voices.forEach(v => { const o = document.createElement("option"); o.value = v.name; o.textContent = v.name.replace(/\s*\(.*\)\s*/,"") + " · " + v.lang; sel.append(o); });
  sel.value = voices.some(v => v.name === state.voice) ? state.voice : "";
}
if(synth){ loadVoices(); synth.addEventListener?.("voiceschanged", loadVoices); synth.onvoiceschanged = loadVoices; }

function setupPlayer(){
  el("listen").hidden = !synth || !el("article").childNodes.length;
  el("rate").value = state.rate || "1";
  updatePlay();
}
function readable(){
  return [...el("article").querySelectorAll("p, li, h2, h3, blockquote")].filter(n =>
    !n.closest(".infobox-wrap, .tablewrap, figure, .gallery") && !(n.tagName === "LI" && n.querySelector("p")) && n.textContent.trim().length > 1);
}
function chunk(text){
  const s = text.replace(/\s+/g, " ").trim().match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g) || [text];
  const out = []; let cur = "";
  s.forEach(x => { if((cur + x).length > 220 && cur){ out.push(cur); cur = x; } else cur += x; });
  if(cur.trim()) out.push(cur);
  return out;
}
function mark(n){ document.querySelectorAll(".speaking").forEach(x => x.classList.remove("speaking")); if(n){ n.classList.add("speaking");
  const r = n.getBoundingClientRect(); if(r.top < 60 || r.bottom > innerHeight - 120) n.scrollIntoView({behavior: reduce() ? "auto" : "smooth", block:"center"}); } }
function firstVisible(blocks){ const i = blocks.findIndex(b => b.getBoundingClientRect().bottom > 80); return i < 0 ? 0 : i; }

function speakNext(){
  if(!tts.on) return;
  while(tts.ci >= tts.chunks.length){
    if(tts.bi >= tts.blocks.length){ stopListen(); return; }
    tts.cur = tts.blocks[tts.bi++]; tts.chunks = chunk(tts.cur.textContent); tts.ci = 0; mark(tts.cur);
  }
  const u = new SpeechSynthesisUtterance(tts.chunks[tts.ci++]);
  const v = voices.find(x => x.name === state.voice);
  if(v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-US";
  u.rate = +state.rate || 1;
  u.onend = () => speakNext();
  u.onerror = e => { if(tts.on && e.error !== "interrupted" && e.error !== "canceled") speakNext(); };
  synth.speak(u);
}
function startListen(){
  if(!synth) return;
  synth.cancel();
  tts.blocks = readable();
  if(!tts.blocks.length) return;
  const resumeAt = tts.cur ? tts.blocks.indexOf(tts.cur) : -1;
  tts.bi = resumeAt >= 0 ? resumeAt : firstVisible(tts.blocks);
  tts.chunks = []; tts.ci = 0; tts.on = true;
  armSleep(); updatePlay(); speakNext();
}
function pauseListen(){ tts.on = false; synth && synth.cancel(); updatePlay(); }
function stopListen(){ tts.on = false; if(synth) synth.cancel(); tts.cur = null; mark(null); clearTimeout(tts.timer); clearInterval(tts.tick); tts.endAt = 0; el("left").textContent = ""; updatePlay(); }
function updatePlay(){
  el("play").textContent = tts.on ? "❚❚ Pause" : (tts.cur ? "▶ Resume" : "▶ Listen");
  el("stopL").hidden = !tts.cur;
  // small floating button only while a story is being read (or paused mid-way)
  const mini = el("mini");
  mini.hidden = !tts.cur;
  mini.textContent = tts.on ? "❚❚" : "▶";
  mini.setAttribute("aria-label", tts.on ? "Pause reading" : "Resume reading");
}
function armSleep(){
  clearTimeout(tts.timer); clearInterval(tts.tick);
  const m = +el("sleep").value;
  if(!m){ tts.endAt = 0; el("left").textContent = ""; return; }
  tts.endAt = Date.now() + m * 60000;
  tts.timer = setTimeout(() => { stopListen(); el("sleep").value = "0"; }, m * 60000);
  const show = () => { const left = Math.max(0, Math.ceil((tts.endAt - Date.now()) / 60000)); el("left").textContent = left + " min left"; };
  show(); tts.tick = setInterval(show, 30000);
}
el("play").addEventListener("click", () => tts.on ? pauseListen() : startListen());
el("mini").addEventListener("click", () => tts.on ? pauseListen() : startListen());
el("stopL").addEventListener("click", () => stopListen());
el("lset").addEventListener("click", () => {
  const open = el("lsettings").hidden;
  el("lsettings").hidden = !open;
  el("lset").setAttribute("aria-expanded", String(open));
  el("lset").textContent = open ? "Hide settings ▴" : "Voice settings ▾";
});
el("voice").addEventListener("change", () => { state.voice = el("voice").value; save(); if(tts.on) startListen(); });
el("rate").addEventListener("change", () => { state.rate = el("rate").value; save(); if(tts.on) startListen(); });
el("sleep").addEventListener("change", () => { if(tts.on) armSleep(); });

/* ---------- text size ---------- */
function applySize(){ document.documentElement.style.setProperty("--size", state.size + "px"); el("sizeOut").textContent = state.size; }
el("smaller").addEventListener("click", () => { state.size = Math.max(15, state.size - 1); applySize(); save(); });
el("bigger").addEventListener("click", () => { state.size = Math.min(26, state.size + 1); applySize(); save(); });

/* ---------- wiring ---------- */
el("read").addEventListener("click", () => state.current && openArticle(state.current.title));
el("another").addEventListener("click", () => findStory());
el("save").addEventListener("click", toggleSave);
el("save2").addEventListener("click", toggleSave);
el("next").addEventListener("click", () => { window.scrollTo({top:0, behavior: reduce() ? "auto" : "smooth"}); findStory(); });
el("home").addEventListener("click", () => { window.scrollTo({top:0, behavior: reduce() ? "auto" : "smooth"}); });

applySize(); renderFilters(); renderLib();
findStory();
setTimeout(backfillThumbs, 2500);

if("serviceWorker" in navigator && location.protocol === "https:"){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(r => r.update()).catch(() => {});
  // when a new version installs, reload once so it shows up right away
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(hadController && !reloaded){ reloaded = true; location.reload(); } });
}
